<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zonga</title>
<style>
    * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 22px; color: #fff; text-align: center;
    background: radial-gradient(circle at 50% 15%, #343434, #141414 55%, #050505);
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  }
  main { width: min(100%, 520px); }
  .eyebrow { color: #bdbdbd; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; }
  h1 { margin: 12px 0 8px; font-size: clamp(38px, 10vw, 64px); line-height: .95; }
  p { color: #d0d0d0; margin: 12px 0 20px; }
  img {
    display: block; width: min(100%, 390px); max-height: 68vh;
    object-fit: contain; margin: 0 auto; border-radius: 14px;
    box-shadow: 0 18px 55px #000b;
  }
  .tag {
    display: inline-block; margin-top: 18px; padding: 10px 17px;
    border: 1px solid #555; border-radius: 999px;
    background: #ffffff0d; font-weight: 750;
  }
  .tiny { margin-top: 24px; color: #777; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">A very important message</div>
  <h1>ZONGA</h1>
  <p>You scanned the code. There is no going back.</p>
  <img src="gorilla.png" alt="A gorilla making a rude hand gesture">
  <div class="tag">Respectfully: you got played.</div>
  <div class="tiny">This page exists for the plot.</div>
</main>
</body>
</html>
